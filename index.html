<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starlink | Connexion</title>
    
    <!-- Lien vers le manifest pour transformer en application web installable -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#38bdf8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght=700&family=Roboto:wght=400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #0f172a; color: white; }
        .logo-wrapper { text-align: center; margin-bottom: 30px; }
        .logo-container {
            display: inline-block; background: #38bdf8; padding: 10px 20px; border: 3px solid white;
            border-radius: 8px; position: relative; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }
        .v-top {
            background: #38bdf8; border: 3px solid white; border-bottom: none; width: 40px; height: 40px;
            position: absolute; top: -38px; left: 50%; transform: translateX(-50%); display: flex;
            align-items: center; justify-content: center; color: #0f172a; font-family: 'Oswald', sans-serif;
            font-size: 24px; font-weight: bold; border-radius: 5px 5px 0 0;
        }
        .main-text {
            color: #0f172a; font-family: 'Oswald', sans-serif; font-size: 28px;
            display: flex; align-items: center; gap: 8px; font-weight: bold;
        }
        .input-group {
            background: rgba(255, 255, 255, 0.95); border-radius: 10px; padding: 12px 15px;
            margin-bottom: 15px; display: flex; align-items: center; border: 2px solid #38bdf8;
        }
        .input-group input { background: transparent; border: none; width: 100%; color: #333; outline: none; font-size: 15px; }
        .btn-login {
            background-color: #38bdf8; color: #0f172a; width: 100%; padding: 15px; border-radius: 50px;
            font-weight: 900; text-transform: uppercase; margin-top: 10px; transition: 0.3s;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-sm">
        <div class="logo-wrapper">
            <div class="logo-container">
                <div class="v-top">S</div>
                <div class="main-text">STARLINK <i class="fa-solid fa-satellite text-xl text-[#0f172a]"></i></div>
            </div>
        </div>

        <p class="text-center mb-8 font-bold text-lg tracking-wider text-[#38bdf8]">CONNEXION</p>

        <form id="loginForm">
            <div class="input-group">
                <input type="tel" id="phone" placeholder="Numéro de téléphone" required>
            </div>
            <div class="input-group">
                <input type="password" id="pin" placeholder="Mot de passe (6 chiffres)" inputmode="numeric" maxlength="6" required>
            </div>
            <button type="submit" id="loginBtn" class="btn-login">SE CONNECTER</button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-white">Pas encore membre ? <a href="register.html" class="font-bold text-[#38bdf8] underline">Inscrivez-vous</a></p>
        </div>
    </div>

    <script>
        // Enregistrement du Service Worker pour la PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker enregistré avec succès:', reg.scope))
                    .catch(err => console.error('Échec de l\'enregistrement du Service Worker:', err));
            });
        }

        const dbUrl = "https://canal-e4274-default-rtdb.firebaseio.com/users";

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const phoneInput = document.getElementById('phone').value.trim();
            const pinInput = document.getElementById('pin').value;
            
            // Formatage du numéro pour s'aligner sur la logique Quartz (+243)
            let fullPhone = phoneInput;
            if (!phoneInput.startsWith("+")) {
                fullPhone = "+243" + (phoneInput.startsWith("0") ? phoneInput.substring(1) : phoneInput);
            }

            btn.innerText = "VÉRIFICATION...";
            btn.disabled = true;

            try {
                // 1. Essai de récupération directe
                const response = await fetch(`${dbUrl}/${fullPhone}.json`);
                const userFound = await response.json();

                if (userFound !== null) {
                    // Vérification du mot de passe (gère 'password' ou 'pin' selon comment c'est stocké)
                    if (userFound.password === pinInput || userFound.pin === pinInput) {
                        localStorage.setItem('userPhone', fullPhone);
                        localStorage.setItem('isLoggedIn', 'true');
                        window.location.href = 'dashboard.html';
                        return;
                    } else {
                        alert("Mot de passe incorrect.");
                        btn.innerText = "SE CONNECTER";
                        btn.disabled = false;
                        return;
                    }
                } else {
                    // 2. Logique de secours (Fallback) : recherche dans tous les utilisateurs comme sur Quartz
                    const backResponse = await fetch(`${dbUrl}.json`);
                    const allUsers = await backResponse.json();
                    let oldUser = null;
                    let foundKey = null;

                    if (allUsers) {
                        for (let id in allUsers) {
                            if (allUsers[id].phone === fullPhone || allUsers[id].phone === phoneInput || id === fullPhone || id === phoneInput) {
                                oldUser = allUsers[id];
                                foundKey = id;
                                break;
                            }
                        }
                    }

                    if (oldUser) {
                        if (oldUser.password === pinInput || oldUser.pin === pinInput) {
                            localStorage.setItem('userPhone', foundKey || oldUser.phone);
                            localStorage.setItem('isLoggedIn', 'true');
                            window.location.href = 'dashboard.html';
                            return;
                        } else {
                            alert("Mot de passe incorrect.");
                            btn.innerText = "SE CONNECTER";
                            btn.disabled = false;
                            return;
                        }
                    }

                    alert("Numéro non inscrit.");
                    btn.innerText = "SE CONNECTER";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                alert("Erreur de connexion.");
                btn.innerText = "SE CONNECTER";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
